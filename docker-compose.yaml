include:
  - env_file : ./.env

services:
  access-control-db:
    image: postgres:16-alpine
    container_name: access-control-db
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: access-control-db
    ports:
      - "9000:5432"
    volumes:
      - ./database_schema/access-control:/docker-entrypoint-initdb.d:ro
      - access_control_data:/var/lib/postgresql/data

  target-postgres:
    image: postgres:16-alpine
    container_name: target-postgres
    environment:
      POSTGRES_USER: target_user
      POSTGRES_PASSWORD: target_password
      POSTGRES_DB: target-test-db
    ports:
      - "9001:5432"
    volumes:
      - ./database_schema/target-database:/docker-entrypoint-initdb.d:ro
      - target_postgres_data:/var/lib/postgresql/data


volumes:
  access_control_data   :
  target_postgres_data  :